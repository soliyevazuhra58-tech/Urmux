name: Urmux Universal APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 'branding/**'
      - 'github-releases/**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Universal APK
        shell: bash
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: '0'
        run: |
          set -euo pipefail

          VERSION_NAME="$(grep -m 1 -E '^[[:space:]]*versionName "([^"]+)"$' app/build.gradle | sed -E 's/^[[:space:]]*versionName "([^"]+)"$/\1/')"
          RELEASE_VERSION_NAME="v${VERSION_NAME}+${GITHUB_SHA:0:7}"
          APK_VERSION_TAG="${RELEASE_VERSION_NAME}-apt-android-7-github-debug"
          APK_BASENAME_PREFIX="urmux-app_${APK_VERSION_TAG}"

          export TERMUX_APP_VERSION_NAME="${RELEASE_VERSION_NAME#v}"
          export TERMUX_APK_VERSION_TAG="${APK_VERSION_TAG}"

          ./gradlew --no-daemon assembleDebug

          APK_PATH="app/build/outputs/apk/debug/${APK_BASENAME_PREFIX}_universal.apk"
          test -f "${APK_PATH}" || {
            echo "Universal APK not found. Available files:"
            find app/build/outputs/apk/debug -maxdepth 1 -type f -print
            exit 1
          }

          (cd app/build/outputs/apk/debug && sha256sum "${APK_BASENAME_PREFIX}_universal.apk" > "${APK_BASENAME_PREFIX}_sha256sums")

      - name: Upload Universal APK
        uses: actions/upload-artifact@v6
        with:
          name: urmux-universal-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/urmux-app_*_universal.apk
            app/build/outputs/apk/debug/urmux-app_*_sha256sums
          if-no-files-found: error
